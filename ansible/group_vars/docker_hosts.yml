---
# Docker host specific variables
docker_root_path: /opt/docker_apps # Base path on remote host for Docker Compose projects
ssh_port: 22

# Firewall settings (UFW)
ufw_enabled: true
ufw_default_incoming_policy: deny
ufw_default_outgoing_policy: allow
ufw_allowed_ports:
  - { port: "{{ ssh_port }}", proto: "tcp", comment: "Allow SSH" }
  - { port: "3000", proto: "tcp", comment: "Grafana Dashboard" }
  - { port: "443", proto: "tcp", comment: "Wazuh Dashboard (or Cloudflare-managed)" }
  - { port: "5601", proto: "tcp", comment: "Wazuh Dashboard internal (if not 443 public)" }
  - { port: "514", proto: "udp", comment: "Wazuh Syslog" }
  - { port: "1514", proto: "tcp", comment: "Wazuh Agent communication" }
  - { port: "1515", proto: "tcp", comment: "Wazuh Agent communication (older)" }
  - { port: "55000", proto: "tcp", comment: "Wazuh API" }
  - { port: "5678", proto: "tcp", comment: "n8n (if exposed)" }
  - { port: "8200", proto: "tcp", from_ip: "127.0.0.1", comment: "Vault (localhost only)" }
  - { port: "9090", proto: "tcp", comment: "Prometheus" }
  - { port: "9100", proto: "tcp", comment: "Node Exporter" }
  - { port: "9000", proto: "tcp", comment: "Portainer" }

# Users to manage
admin_users:
  - name: mgmt
    groups: [sudo, docker]
    # Assuming the public key for 'mgmt' user is available on the Ansible control machine
    # You might need to adjust this path or dynamically fetch the key
    ssh_key: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/id_rsa.pub') }}"

# SSH Hardening
ssh_password_authentication: "no"
ssh_permit_root_login: "no"
ssh_x11_forwarding: "no"
