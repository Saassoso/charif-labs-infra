---
# ansible/roles/docker_applications/tasks/main.yml
- name: Ensure base Docker applications directory exists on remote host
  ansible.builtin.file:
    path: "{{ docker_root_path }}"
    state: directory
    mode: '0755'

- name: Copy Docker applications directory to remote host
  ansible.builtin.copy:
    src: ../../../docker/
    dest: "{{ docker_root_path }}/"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Find all docker-compose.yml files in the 1-foundation stack
  ansible.builtin.find:
    paths: "{{ docker_root_path }}/1-foundation"
    patterns: docker-compose.yml
    recurse: true
  register: foundation_compose_files

- name: Deploy ONLY Foundation stacks (Portainer & Cloudflared)
  ansible.builtin.command: docker compose up -d --remove-orphans
  args:
    chdir: "{{ item.path | ansible.builtin.dirname }}"
  loop: "{{ foundation_compose_files.files }}"
  changed_when: false
