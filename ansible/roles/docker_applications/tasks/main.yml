---
- name: Ensure base Docker applications directory exists on remote host
  ansible.builtin.file:
    path: "{{ docker_root_path }}"
    state: directory
    owner: "{{ ansible_user | default('mgmt') }}"
    group: "{{ ansible_user | default('mgmt') }}"
    mode: '0755'

- name: Fast Sync Docker applications directory using Rsync
  ansible.posix.synchronize:
    src: ../../../docker/
    dest: "{{ docker_root_path }}/"
    archive: true
    delete: true
  become: false

- name: Ensure external Docker network 'sovereign_net' exists
  ansible.builtin.command: docker network create sovereign_net
  register: docker_applications_create_net
  failed_when: "docker_applications_create_net.rc != 0 and 'already exists' not in docker_applications_create_net.stderr"
  changed_when: "docker_applications_create_net.rc == 0"

- name: Find all docker-compose.yml files in the 1-foundation stack
  ansible.builtin.find:
    paths: "{{ docker_root_path }}/1-foundation"
    patterns: docker-compose.yml
    recurse: true
  register: docker_applications_foundation_compose_files

- name: Deploy Cloudflared to ALL hosts (For Cloudflare Tunnel HA)
  ansible.builtin.command: docker compose up -d --remove-orphans
  args:
    chdir: "{{ docker_root_path }}/1-foundation/cloudflared"
  changed_when: false

- name: Deploy Portainer Server ONLY to Primary Host
  ansible.builtin.command: docker compose up -d --remove-orphans
  args:
    chdir: "{{ docker_root_path }}/1-foundation/portainer"
  when: "'primary_host' in group_names"
  changed_when: false

- name: Deploy Portainer Agent ONLY to Standby Host
  ansible.builtin.command: docker compose up -d --remove-orphans
  args:
    chdir: "{{ docker_root_path }}/1-foundation/portainer-agent"
  when: "'standby_host' in group_names"
  changed_when: false

- name: Generate Keycloak .env securely from Vault (For True HA)
  ansible.builtin.copy:
    dest: "{{ docker_root_path }}/2-applications/identity/.env"
    content: |
      KC_DB=postgres
      KC_DB_URL={{ keycloak_db_url }}
      KC_DB_USERNAME={{ keycloak_db_user }}
      KC_DB_PASSWORD={{ keycloak_db_password }}
      KC_CACHE=ispn
      KC_CLUSTER_LOCAL_ADDR={{ ansible_host }}
      KC_HOSTNAME=https://{{ keycloak_hostname }}
      KEYCLOAK_ADMIN=admin
      KEYCLOAK_ADMIN_PASSWORD={{ keycloak_admin_password }}
    mode: '0600'

- name: Deploy Keycloak Application Stack to ALL HA Hosts
  ansible.builtin.command: docker compose up -d --remove-orphans
  args:
    chdir: "{{ docker_root_path }}/2-applications/identity"
  changed_when: false

- name: Generate Wazuh/Security .env securely from Vault
  ansible.builtin.copy:
    dest: "{{ docker_root_path }}/2-applications/security/.env"
    content: |
      WAZUH_INDEXER_USER={{ wazuh_indexer_user }}
      WAZUH_INDEXER_PASS={{ wazuh_indexer_pass }}
      WAZUH_API_USER={{ wazuh_api_user }}
      WAZUH_API_PASS={{ wazuh_api_pass }}
      DASHBOARD_USER={{ wazuh_indexer_user }}
      DASHBOARD_PASS={{ wazuh_indexer_pass }}
    mode: '0600'

- name: Deploy All Stacks to All Hosts (Active-Passive Steering via Cloudflare)
  ansible.builtin.command: docker compose up -d --remove-orphans
  args:
    chdir: "{{ docker_root_path }}/2-applications/{{ item }}"
  loop:
    - automation
    - observability
    - secrets
    - security
  changed_when: false

# ==========================================
# AUTOMATED REPLICATION SETUP (PRIMARY ONLY)
# ==========================================
- name: Deploy Automated HA Replication Script to Primary Host
  ansible.builtin.copy:
    dest: /opt/sync-to-standby.sh
    owner: root
    group: root
    mode: '0755'
    content: |
      #!/bin/bash
      STANDBY="100.107.233.53"
      STANDBY_USER="mgmt"

      if docker ps | grep -q keycloak-db; then
        docker exec keycloak-db pg_dump -U keycloak keycloak > /tmp/kc-backup.sql
        scp -o StrictHostKeyChecking=no /tmp/kc-backup.sql $STANDBY_USER@$STANDBY:/tmp/kc-backup.sql
        ssh -o StrictHostKeyChecking=no $STANDBY_USER@$STANDBY "docker exec -i keycloak-db psql -U keycloak keycloak < /tmp/kc-backup.sql"
      fi

      rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" /opt/docker_apps/2-applications/security/config/ $STANDBY_USER@$STANDBY:/opt/docker_apps/2-applications/security/config/
      rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" /opt/docker_apps/2-applications/secrets/vault-data/ $STANDBY_USER@$STANDBY:/opt/docker_apps/2-applications/secrets/vault-data/
  when: "'primary_host' in group_names"

- name: Schedule Hourly Asynchronous Data Sync Cron Job
  ansible.builtin.cron:
    name: "Sovereign Stack HA Core Replication"
    minute: "0"
    job: "/opt/sync-to-standby.sh >> /var/log/ha-sync.log 2>&1"
  when: "'primary_host' in group_names"
