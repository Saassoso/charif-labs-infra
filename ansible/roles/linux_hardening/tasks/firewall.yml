---
- name: Configure hosts.allow for SSH (Management Network Only)
  ansible.builtin.lineinfile:
    path: /etc/hosts.allow
    line: "sshd: {{ management_network | default('10.0.30.0/29') }}"
    state: present

- name: Configure hosts.deny for SSH (Block everyone else)
  ansible.builtin.lineinfile:
    path: /etc/hosts.deny
    line: "sshd: ALL"
    state: present