---
- name: Include SSH hardening tasks
  ansible.builtin.include_tasks:
    file: ssh.yml

- name: Check if Tailscale is connected
  ansible.builtin.command: tailscale status
  register: ts_status
  changed_when: false
  failed_when: false

- name: Include Firewall configuration tasks (only after Tailscale is connected)
  ansible.builtin.include_tasks:
    file: firewall.yml
  when: ts_status.rc == 0 and 'Logged out' not in ts_status.stdout

- name: Include User management tasks
  ansible.builtin.include_tasks:
    file: users.yml
