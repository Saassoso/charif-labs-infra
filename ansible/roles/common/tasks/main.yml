- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install common packages
  ansible.builtin.apt:
    name: 
      - git
      - htop
      - curl
      - vim
      - ntp
    state: latest

- name: Ensure NTP service is running and enabled
  ansible.builtin.service:
    name: ntp
    state: started
    enabled: yes

- name: Ensure Python 3 is installed (for Ansible interpreter)
  ansible.builtin.apt:
    name: python3
    state: present
