services:
  agent:
    image: portainer/agent:latest
    container_name: portainer_agent
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    ports:
      - "100.107.233.53:9001:9001"
    networks:
      - sovereign_net

networks:
  sovereign_net:
    external: true
