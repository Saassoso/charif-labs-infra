services:
  n8n:
    image: n8nio/n8n:latest
    hostname: n8n-soar
    ports:
      # Bound to localhost so it is only reachable via Cloudflare Tunnel or local Docker network
      - "127.0.0.1:5678:5678"
    environment:
      # Networking
      - N8N_HOST=n8n.charif-labs.tech
      - WEBHOOK_URL=https://n8n.charif-labs.tech
      - GENERIC_TIMEZONE=Africa/Casablanca
      - N8N_PUSH_BACKEND=sse
      
      # Security (Basic Auth is enabled to protect webhooks/UI if CF Access fails)
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-SovereignStack_2026!}
      
      # Privacy & Telemetry
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      
      # Community Packages
      - N8N_COMMUNITY_PACKAGES_ENABLED=true

      - N8N_PUSH_BACKEND=websocket   # ← was "sse", websockets survive CF Tunnel
      - N8N_PROTOCOL=https           # ← add this, tells n8n it's behind HTTPS
      - N8N_PORT=5678                # ← add this explicitly

    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - sovereign_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  n8n_data:
    external: true
    name: sovereign-stack_n8n_data

networks:
  sovereign_net:
    external: true
