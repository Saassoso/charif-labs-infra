global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - '100.77.129.58:9100'
          - '100.107.233.53:9100'

  - job_name: 'docker'
    static_configs:
      - targets:
          - '100.77.129.58:9323'  # Primary 
          - '100.107.233.53:9323' # Standby
