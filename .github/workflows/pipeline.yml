name: Charif Labs Infrastructure CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  # ==========================================
  # STAGE 1: SECURITY & SECRETS SCANNING
  # ==========================================
  security-checks:
    name: Security & Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Scan for Hardcoded Secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Infrastructure as Code Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@68b488a75bdf7fe1ef4c104a8b33221b42c3bf9c
        with:
          scan-type: 'config'
          skip-dirs: 'docker/2-applications/secrets/vault-data'
          hide-progress: false
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # ==========================================
  # STAGE 2: VALIDATION & LINTING (Runs in parallel)
  # ==========================================
  validate-infra:
    name: Validate Terraform, Docker & Ansible
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Terraform Plugin Cache Dir
        run: mkdir -p ~/.terraform.d/plugin-cache

      - name: Cache Terraform Providers
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('terraform/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check
        working-directory: ./terraform

      - name: Terraform Validate
        env:
          TF_VAR_cloudflare_api_token: "fake"
          TF_VAR_cloudflare_account_id: "fake"
          TF_VAR_cloudflare_zone_id: "fake"
          TF_VAR_keycloak_client_secret: "fake"
          TF_VAR_forwarding_email: "fake@test.com"
          TF_VAR_admin_email: "fake@test.com"
          TF_VAR_ms_verification_code: "MS=fake"
          TF_VAR_google_site_verification_code: "google-fake"
        run: |
          terraform init
          terraform validate
        working-directory: ./terraform

      - name: Validate Docker Compose
        run: |
          touch docker/.env
          touch docker/2-applications/identity/.env
          docker compose -f docker/docker-compose.yml config -q

      - name: Prepare Ansible Environment
        working-directory: ./ansible
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass
          ansible-galaxy collection install ansible.posix

      - name: Run Ansible Lint
        uses: ansible/ansible-lint@main
        env:
          ANSIBLE_VAULT_PASSWORD_FILE: .vault_pass
        with:
          working_directory: "ansible/"
          setup_qemu: false

  # ==========================================
  # STAGE 3: AUTOMATIC VERSION TAGGING
  # ==========================================
  version-tagging:
    name: Auto-Tag Version
    runs-on: ubuntu-latest
    needs: [security-checks, validate-infra]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write 
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: minor 
          release_branches: main

  # ==========================================
  # STAGE 4: TRUE GITOPS DEPLOYMENT (ANSIBLE)
  # ==========================================
  deploy-production:
    name: Deploy via Ansible
    runs-on: ubuntu-latest
    needs: [version-tagging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to Tailscale VPN
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci

      - name: Setup Python & Ansible
        run: |
          pipx install ansible-core
          ansible-galaxy collection install ansible.posix

      - name: Configure SSH and Vault
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VAULT_PASS: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
          echo "$VAULT_PASS" > .vault_pass

      - name: Run Ansible Deployment Playbook
        env:
          ANSIBLE_VAULT_PASSWORD_FILE: .vault_pass
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/playbooks/deploy_docker_stacks.yml \
          --extra-vars "ansible_become_pass=${{ secrets.SUDO_PASSWORD }}"

  # ==========================================
  # STAGE 5: GLOBAL FAILURE NOTIFICATION
  # ==========================================
  notify-failure:
    name: Failure Alert
    runs-on: ubuntu-latest
    needs: [security-checks, validate-infra, version-tagging, deploy-production]
    if: always() && contains(needs.*.result, 'failure')
    steps:
      - name: Generate Rich GitHub Step Summary
        run: |
          echo "### ❌ Charif Labs Pipeline Failure" >> $GITHUB_STEP_SUMMARY
          echo "The infrastructure deployment pipeline failed on commit **${{ github.sha }}**." >> $GITHUB_STEP_SUMMARY
          echo "#### Action Required:" >> $GITHUB_STEP_SUMMARY