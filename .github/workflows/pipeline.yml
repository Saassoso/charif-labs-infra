name: Charif Labs Infrastructure CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  # ==========================================
  # STAGE 1: SECURITY & SECRETS SCANNING
  # ==========================================
  security-checks:
    name: Security & Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Scan for Hardcoded Secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Infrastructure as Code Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@68b488a75bdf7fe1ef4c104a8b33221b42c3bf9c
        with:
          scan-type: 'config'
          skip-dirs: 'docker/2-applications/secrets/vault-data'
          hide-progress: false
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # ==========================================
  # STAGE 2: VALIDATION & LINTING (Runs in parallel)
  # ==========================================
  validate-infra:
    name: Validate Terraform, Docker & Ansible
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Terraform Plugin Cache Dir
        run: mkdir -p ~/.terraform.d/plugin-cache

      - name: Cache Terraform Providers
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('terraform/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check
        working-directory: ./terraform

      - name: Terraform Validate
        env:
          TF_VAR_cloudflare_api_token: "fake"
          TF_VAR_cloudflare_account_id: "fake"
          TF_VAR_cloudflare_zone_id: "fake"
          TF_VAR_keycloak_client_secret: "fake"
          TF_VAR_forwarding_email: "fake@test.com"
          TF_VAR_admin_email: "fake@test.com"
          TF_VAR_ms_verification_code: "MS=fake"
          TF_VAR_google_site_verification_code: "google-fake"
        run: |
          terraform init
          terraform validate
        working-directory: ./terraform

      - name: Validate Docker Compose
        run: |
          touch docker/.env
          touch docker/2-applications/identity/.env
          docker compose -f docker/docker-compose.yml config -q

      - name: Prepare Ansible Environment
        working-directory: ./ansible
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass
          ansible-galaxy collection install ansible.posix

      - name: Run Ansible Lint
        uses: ansible/ansible-lint@main
        env:
          ANSIBLE_VAULT_PASSWORD_FILE: .vault_pass
        with:
          working_directory: "ansible/"

  # ==========================================
  # STAGE 3: AUTOMATIC VERSION TAGGING
  # ==========================================
  version-tagging:
    name: Auto-Tag Version
    runs-on: ubuntu-latest
    needs: [security-checks, validate-infra]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write 
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: minor 
          release_branches: main

  # ==========================================
  # STAGE 4: PORTAINER DEPLOYMENT
  # ==========================================
  deploy-production:
    name: Trigger Portainer Webhook
    runs-on: ubuntu-latest
    needs: version-tagging
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Call Portainer Webhooks (Strict Error Handling)
        run: |
          FAILED=0
          
          webhooks=(
            "${{ secrets.PORTAINER_WEBHOOK_AUTOMATION }}"
            "${{ secrets.PORTAINER_WEBHOOK_IDENTITY }}"
            "${{ secrets.PORTAINER_WEBHOOK_OBSERVABILITY }}"
            "${{ secrets.PORTAINER_WEBHOOK_SECRETS }}"
            "${{ secrets.PORTAINER_WEBHOOK_SECURITY }}"
          )
          
          for url in "${webhooks[@]}"; do
            # Skip empty webhooks if some aren't configured yet
            if [ -z "$url" ]; then continue; fi
            
            if ! curl --fail --silent --show-error -X POST "$url"; then
              echo "::error::Webhook deployment failed for a target URL."
              FAILED=$((FAILED + 1))
            fi
          done
          
          if [ $FAILED -ne 0 ]; then
            echo "$FAILED Webhook deployments failed completely."
            exit 1
          fi

  # ==========================================
  # STAGE 5: GLOBAL FAILURE NOTIFICATION
  # ==========================================
  notify-failure:
    name: Failure Alert
    runs-on: ubuntu-latest
    needs: [security-checks, validate-infra, version-tagging, deploy-production]
    if: always() && contains(needs.*.result, 'failure')
    steps:
      - name: Generate Rich GitHub Step Summary
        run: |
          echo "### ❌ Charif Labs Pipeline Failure" >> $GITHUB_STEP_SUMMARY
          echo "The infrastructure deployment pipeline failed on commit **${{ github.sha }}**." >> $GITHUB_STEP_SUMMARY
          echo "#### Action Required:" >> $GITHUB_STEP_SUMMARY
          echo "Please check the specific failing Stage logs inside this Actions workflow run." >> $GITHUB_STEP_SUMMARY